<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Matrix Slide Finder</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Supabase (demo de clasificaciones compartidas) -- ver SUPABASE_CONFIG en taskpane.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --mx-red: #CE0E2D;
            --mx-grey: #F6F6F6;
            --mx-tan: #D6D1C4;
            --mx-navy: #06262D;
            --mx-font: 'Century Gothic', 'CenturyGothic', 'AppleGothic', Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: var(--mx-font);
            background: var(--mx-grey);
            color: var(--mx-navy);
        }

        /* ---------- Header ---------- */
        .mx-header {
            background: var(--mx-navy);
            color: #fff;
            padding: 16px 16px 14px 16px;
        }

        .mx-logo {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .mx-logo span {
            font-weight: 300;
            opacity: 0.65;
            margin-left: 4px;
        }

        .mx-tool-label {
            font-size: 11px;
            color: var(--mx-tan);
            margin-top: 3px;
            font-weight: 300;
        }

        /* ---------- Body ---------- */
        .mx-body {
            padding: 14px 16px 16px 16px;
        }

        .mx-filter-group {
            margin-bottom: 14px;
        }

        .mx-label {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--mx-navy);
            opacity: 0.75;
            margin-bottom: 6px;
        }

        /* ---------- Filter chips ---------- */
        .mx-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .mx-chip {
            padding: 5px 12px;
            border-radius: 13px;
            border: 1px solid var(--mx-tan);
            background: #fff;
            color: var(--mx-navy);
            font-size: 12px;
            font-family: var(--mx-font);
            cursor: pointer;
            user-select: none;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }

        .mx-chip:hover {
            border-color: var(--mx-red);
        }

        .mx-chip.activo {
            background: var(--mx-red);
            border-color: var(--mx-red);
            color: #fff;
        }

        /* ---------- Search ---------- */
        #filtro-texto {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--mx-tan);
            background: transparent;
            padding: 6px 2px;
            font-size: 13px;
            font-family: var(--mx-font);
            color: var(--mx-navy);
        }

        #filtro-texto::placeholder {
            color: #9aa3a5;
        }

        #filtro-texto:focus {
            outline: none;
            border-bottom: 1px solid var(--mx-red);
        }

        /* ---------- Counter ---------- */
        .mx-counter {
            font-size: 11px;
            color: var(--mx-navy);
            opacity: 0.55;
            margin: 12px 0 8px 0;
        }

        /* ---------- Results ---------- */
        .mx-results {
            display: flex;
            flex-direction: column;
        }

        .mx-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--mx-tan);
            cursor: pointer;
        }

        .mx-card:hover {
            background: rgba(206, 14, 45, 0.05);
        }

        .mx-card-num {
            min-width: 30px;
            font-size: 20px;
            font-weight: 300;
            color: var(--mx-red);
            line-height: 1.1;
        }

        /* ---------- Miniatura ---------- */
        .mx-thumb-wrap {
            position: relative;
            width: 104px;
            flex-shrink: 0;
        }

        .mx-thumb {
            width: 104px;
            height: 58px;
            object-fit: cover;
            object-position: top center;
            display: block;
            background: #fff;
            border: 1px solid var(--mx-tan);
        }

        .mx-thumb-fallback {
            width: 104px;
            height: 58px;
            background: #fff;
            border: 1px dashed var(--mx-tan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #9aa3a5;
        }

        .mx-thumb-num {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--mx-red);
            color: #fff;
            font-size: 10px;
            padding: 1px 5px;
            line-height: 1.4;
        }

        .mx-card-body {
            flex: 1;
            min-width: 0;
        }

        .mx-card-title {
            font-size: 12.5px;
            color: var(--mx-navy);
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .mx-card-title.sin-titulo {
            opacity: 0.5;
            font-style: italic;
        }

        .mx-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .mx-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            background: var(--mx-tan);
            color: var(--mx-navy);
        }

        .mx-tag.cero {
            background: transparent;
            border: 1px solid var(--mx-tan);
            opacity: 0.5;
        }

        /* ---------- Etiquetas libres ---------- */
        .mx-etiquetas-fila {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 6px;
        }

        .mx-etiqueta {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--mx-red);
            color: var(--mx-red);
            cursor: pointer;
            user-select: none;
            transition: background 0.12s, color 0.12s;
        }

        .mx-etiqueta:hover {
            background: var(--mx-red);
            color: #fff;
        }

        .mx-etiquetas-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .mx-etiqueta-editable {
            cursor: default;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .mx-etiqueta-editable:hover {
            background: #fff;
            color: var(--mx-red);
        }

        .mx-etiqueta-x {
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
        }

        .mx-etiqueta-x:hover {
            color: var(--mx-navy);
        }

        /* ---------- Selected confirmation ---------- */
        .mx-selected {
            background: #fff;
            border-left: 3px solid var(--mx-red);
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .mx-selected b {
            color: var(--mx-red);
        }

        .mx-selected i {
            color: #8a9497;
        }

        /* ---------- Estado de inserción ---------- */
        .mx-estado {
            display: none;
            background: #fff;
            border-left: 3px solid var(--mx-tan);
            border-radius: 0;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--mx-navy);
        }

        .mx-estado.cargando {
            border-left-color: var(--mx-tan);
        }

        .mx-estado.ok {
            border-left-color: var(--mx-navy);
        }

        .mx-estado.error {
            border-left-color: var(--mx-red);
        }

        /* ---------- Empty state ---------- */
        .mx-empty {
            font-size: 12px;
            color: var(--mx-navy);
            opacity: 0.6;
            padding: 20px 4px;
            text-align: center;
            border: 1px dashed var(--mx-tan);
            border-radius: 4px;
        }

        /* ---------- Modal de previsualización ---------- */
        .mx-modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(6, 38, 45, 0.55);
            z-index: 100;
            padding: 20px 14px;
            overflow-y: auto;
        }

        .mx-modal-backdrop.abierto {
            display: block;
        }

        .mx-modal {
            background: var(--mx-grey);
            border-radius: 4px;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .mx-modal-close {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(6, 38, 45, 0.55);
            color: #fff;
            font-family: var(--mx-font);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mx-modal-close:hover {
            background: var(--mx-red);
        }

        .mx-modal-img-wrap {
            background: #fff;
            border-bottom: 1px solid var(--mx-tan);
        }

        .mx-modal-img {
            width: 100%;
            display: block;
        }

        .mx-modal-body {
            padding: 14px;
        }

        .mx-modal-titulo {
            font-size: 13px;
            color: var(--mx-navy);
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .mx-modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 16px;
        }

        .mx-modal-actions {
            display: flex;
            gap: 8px;
        }

        .mx-btn {
            font-family: var(--mx-font);
            font-size: 12px;
            padding: 9px 14px;
            border-radius: 3px;
            border: 1px solid var(--mx-tan);
            background: #fff;
            color: var(--mx-navy);
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .mx-btn:hover {
            border-color: var(--mx-navy);
        }

        .mx-btn-primario {
            background: var(--mx-red);
            border-color: var(--mx-red);
            color: #fff;
        }

        .mx-btn-primario:hover {
            background: #a80c24;
            border-color: #a80c24;
        }

        .mx-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        /* ---------- Clasificación colapsable (dentro del modal) ---------- */
        .mx-modal-clasificar-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: none;
            border: none;
            border-top: 1px solid var(--mx-tan);
            padding: 10px 2px 0;
            margin-top: 4px;
            font-family: var(--mx-font);
            font-size: 12px;
            color: var(--mx-navy);
            opacity: 0.85;
            cursor: pointer;
        }

        .mx-modal-clasificar-toggle:hover {
            color: var(--mx-red);
            opacity: 1;
        }

        .mx-modal-clasificar-chevron {
            font-size: 10px;
            transition: transform 0.15s;
        }

        .mx-modal-clasificar-chevron.abierto {
            transform: rotate(180deg);
        }

        .mx-modal-clasificar-body {
            display: none;
            margin-top: 14px;
        }

        .mx-modal-clasificar-body.abierto {
            display: block;
        }

        /* ---------- Sección / Subsección (manual) ---------- */
        .mx-cat-label {
            font-size: 11px;
            color: var(--mx-navy);
            opacity: 0.75;
            margin-bottom: 6px;
        }

        .mx-cat-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .mx-cat-chip {
            padding: 5px 11px;
            border-radius: 13px;
            border: 1px solid var(--mx-tan);
            background: #fff;
            color: var(--mx-navy);
            font-size: 11.5px;
            font-family: var(--mx-font);
            cursor: pointer;
            user-select: none;
        }

        .mx-cat-chip:hover {
            border-color: var(--mx-navy);
        }

        .mx-cat-chip.activo {
            background: var(--mx-navy);
            border-color: var(--mx-navy);
            color: #fff;
        }

        .mx-cat-detectada {
            font-size: 11px;
            color: var(--mx-navy);
            background: var(--mx-tan);
            display: inline-block;
            padding: 3px 8px;
            border-radius: 2px;
            margin-bottom: 16px;
        }

        .mx-cat-nueva {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .mx-cat-nueva input {
            flex: 1;
            font-family: var(--mx-font);
            font-size: 11.5px;
            padding: 5px 9px;
            border: 1px solid var(--mx-tan);
            border-radius: 13px;
            background: #fff;
            color: var(--mx-navy);
        }

        .mx-cat-nueva input:focus {
            outline: none;
            border-color: var(--mx-navy);
        }

        .mx-cat-nueva button {
            font-family: var(--mx-font);
            font-size: 11.5px;
            padding: 5px 12px;
            border-radius: 13px;
            border: 1px dashed var(--mx-navy);
            background: #fff;
            color: var(--mx-navy);
            cursor: pointer;
        }

        .mx-cat-nueva button:hover {
            background: var(--mx-navy);
            color: #fff;
        }

        .mx-tag.pendiente {
            background: transparent;
            border: 1px dashed var(--mx-red);
            color: var(--mx-red);
            opacity: 0.75;
        }

        /* ---------- Selects desplegables (filtro y modal) ---------- */
        .mx-select {
            width: 100%;
            font-family: var(--mx-font);
            font-size: 12.5px;
            padding: 7px 9px;
            border: 1px solid var(--mx-tan);
            border-radius: 4px;
            background: #fff;
            color: var(--mx-navy);
            cursor: pointer;
        }

        .mx-select:focus {
            outline: none;
            border-color: var(--mx-red);
        }

        .mx-select:disabled {
            opacity: 0.55;
            cursor: default;
            background: var(--mx-grey);
        }

        .mx-select.mx-modal-select {
            margin-bottom: 10px;
        }

        .mx-label-hint {
            font-weight: 300;
            opacity: 0.7;
            font-size: 10px;
        }

        /* ---------- Progreso de sección/subsección + exportar ---------- */
        .mx-progreso {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--mx-navy);
            opacity: 0.75;
            margin-top: 4px;
        }

        .mx-progreso button {
            font-family: var(--mx-font);
            font-size: 11px;
            background: none;
            border: none;
            color: var(--mx-navy);
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            opacity: 0.85;
        }

        .mx-progreso button:hover {
            color: var(--mx-red);
        }

        /* ---------- Recientes ---------- */
        .mx-link-btn {
            font-family: var(--mx-font);
            font-size: 10px;
            background: none;
            border: none;
            color: var(--mx-navy);
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            margin-left: 8px;
            opacity: 0.6;
        }

        .mx-link-btn:hover {
            color: var(--mx-red);
            opacity: 1;
        }

        .mx-recientes {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .mx-recientes-item {
            cursor: pointer;
            flex-shrink: 0;
        }

        .mx-recientes-thumb {
            width: 62px;
            height: 35px;
            object-fit: cover;
            object-position: top center;
            display: block;
            background: #fff;
            border: 1px solid var(--mx-tan);
        }

        .mx-recientes-item:hover .mx-recientes-thumb {
            border-color: var(--mx-red);
        }

        .mx-recientes-thumb-vacio {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--mx-navy);
        }

        .mx-tag.usos {
            background: transparent;
            border: 1px solid var(--mx-navy);
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <header class="mx-header">
        <div class="mx-logo">Matrix<span>Consulting</span></div>
        <div class="mx-tool-label">| Buscador de láminas</div>
    </header>

    <main class="mx-body">
        <div class="mx-filter-group" id="recientes-wrap" style="display:none;">
            <label class="mx-label">Insertadas recientemente
                <button type="button" id="btn-limpiar-recientes" class="mx-link-btn">Limpiar</button>
            </label>
            <div class="mx-recientes" id="recientes-lista"></div>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label">N° de gráficos</label>
            <div class="mx-chips" id="botones-graficos">
                <span class="mx-chip activo" data-valor="cualquiera">Cualquiera</span>
                <span class="mx-chip" data-valor="0">0</span>
                <span class="mx-chip" data-valor="1">1</span>
                <span class="mx-chip" data-valor="2">2</span>
                <span class="mx-chip" data-valor="3+">3+</span>
            </div>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label">N° de elementos <span class="mx-label-hint">(conceptos, columnas, niveles… asignado a mano por lámina)</span></label>
            <div class="mx-chips" id="botones-elementos">
                <span class="mx-chip activo" data-valor="cualquiera">Cualquiera</span>
                <span class="mx-chip" data-valor="1">1</span>
                <span class="mx-chip" data-valor="2">2</span>
                <span class="mx-chip" data-valor="3">3</span>
                <span class="mx-chip" data-valor="4">4</span>
                <span class="mx-chip" data-valor="5">5</span>
                <span class="mx-chip" data-valor="6+">6+</span>
                <span class="mx-chip" data-valor="N/A">No aplica</span>
            </div>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label" for="filtro-seccion-select">Sección</label>
            <select class="mx-select" id="filtro-seccion-select"></select>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label" for="filtro-subseccion-select">Subsección <span class="mx-label-hint">(opcional — déjalo en "Cualquiera" para filtrar solo por sección)</span></label>
            <select class="mx-select" id="filtro-subseccion-select"></select>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label" for="filtro-etiqueta-select">Etiqueta <span class="mx-label-hint">(palabras clave propias, asignadas a mano)</span></label>
            <select class="mx-select" id="filtro-etiqueta-select"></select>
        </div>

        <div class="mx-filter-group">
            <label class="mx-label" for="filtro-texto">Buscar por etiqueta o título</label>
            <input type="text" id="filtro-texto" placeholder="ej. flujo circular, tabla…" />
        </div>

        <div id="estado" class="mx-estado"></div>

        <div class="mx-filter-group">
            <label class="mx-label" for="orden-select">Ordenar por
                <button type="button" id="btn-limpiar-filtros" class="mx-link-btn">Limpiar filtros</button>
            </label>
            <select class="mx-select" id="orden-select">
                <option value="numero">N° de lámina</option>
                <option value="usos">Más usadas primero</option>
            </select>
        </div>

        <div id="contador" class="mx-counter"></div>
        <div class="mx-progreso">
            <span id="progreso-categorias"></span>
            <span>
                <button id="btn-importar-secciones" type="button">Importar secciones</button>
                <button id="btn-exportar-secciones" type="button">Exportar secciones</button>
            </span>
        </div>
        <input type="file" id="input-importar-secciones" accept=".json" style="display:none" />
        <datalist id="etiquetas-datalist"></datalist>

        <div id="resultados" class="mx-results"></div>
    </main>

    <div id="modal-backdrop" class="mx-modal-backdrop">
        <div class="mx-modal" id="modal-contenido"></div>
    </div>
</body>

</html>
